[theme]
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "'Source Serif 4':https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap"
baseRadius = "0.6rem"
buttonRadius = "0.6rem"
showWidgetBorder = true
showSidebarBorder = true
metricValueFontWeight = 650

[theme.light]
primaryColor = "#2a4d8f"
backgroundColor = "#fbfaf7"
secondaryBackgroundColor = "#f2f0eb"
textColor = "#1d1c1a"
borderColor = "#e3e0d8"

[theme.light.sidebar]
backgroundColor = "#f5f3ee"

[theme.dark]
primaryColor = "#7fa6ee"
backgroundColor = "#141413"
secondaryBackgroundColor = "#1f1e1c"
textColor = "#eeece7"
borderColor = "#34322e"

[theme.dark.sidebar]
backgroundColor = "#1a1918"
